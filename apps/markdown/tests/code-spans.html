<p>A <code>simple</code> span.</p>
<p>Two backticks: <code>a ` b</code>.</p>
<p>Three: <code>x `` y</code>.</p>
<p>Unmatched ` backtick stays literal.</p>
<p><code>`</code> is a single backtick.</p>
<p><code> padded </code> keeps inner spaces, strips one each side.</p>
<p><code>a b</code> joins lines with a space.</p>
<p><code>&lt;b&gt;&amp;amp;&lt;/b&gt;</code> is escaped, not markup.</p>
<p>Empty `` span.</p>
