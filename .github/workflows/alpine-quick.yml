name: Alpine quick
on:
  push:
    branches: ['feat/musl-quick']
  workflow_dispatch: {}
jobs:
  sched:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh scripts/ci-alpine.sh sched
      - run: |
          docker run --rm -e GITHUB_SHA -e GITHUB_REF_NAME -v "$PWD:/w" -w /w alpine:3.22 sh scripts/ci-alpine.sh bundle
          ls -l *.tar.gz
          mkdir x && tar -xzf *.tar.gz -C x && ls x x/runtime | head -30 && cat x/NOTES.txt
