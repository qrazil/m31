name: CI

# Every gate, on every push to master and every PR targeting it. This
# project had zero CI before this workflow and did all of tonight's
# verification by hand -- this is the cheap, obvious piece: just run the
# project's own gates.sh so a broken push to master is visible without
# someone remembering to run it locally. See release.yml for the tag-
# triggered build-and-publish workflow, which runs this same precondition
# before it packages anything.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run every gate
        # 30 minutes was a guess, never measured against a real run; the
        # first one actually completed here (2026-10-02, commit a8afd8c)
        # took ~31 minutes just to reach the timeout, with "corpus (raw
        # syscalls)" and "sanitizers" never even starting -- GitHub's
        # shared runners are not faster than this project's own dev
        # machines, where a full gates.sh run takes 80-90 minutes
        # end to end (dominated by the corpus run, twice, and ASan/UBSan).
        # 120 is a real margin above that, not another guess.
        timeout-minutes: 120
        run: ./gates.sh
