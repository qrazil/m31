name: Release

# Build release binaries for the compiler and every app under apps/, and
# attach them to the GitHub Release for a pushed version tag -- so they can
# be pulled by a direct URL (a release asset URL, stable per tag), not just
# built from source.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# gates.sh is a hard precondition: if it fails, nothing is built or
# published. A broken build must never produce a release.
#
# Verified by hand before this workflow was written (see the PR/commit this
# came in with for the session notes): `cargo build --release`,
# `./gates.sh`, and every `build.sh`/`build-*.sh` invocation below were run
# for real, on Linux x86-64, in a local worktree. What was NOT verified is
# this YAML actually executing on GitHub's runners -- that needs a real tag
# push. See the macOS notes below for the one thing that is a research
# finding rather than a guess.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release needs this to create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Precondition: every gate, on Linux. Nothing downstream runs if this
  # fails. This is the project's own ./gates.sh -- cargo build/test/clippy/
  # fmt, the "no dependencies"/"no unsafe" house rules, the runtime
  # separate-TU check, the full corpus (gcc vs clang, -O0 vs -O2, Go twins,
  # refcount invariant), the corpus again on raw syscalls, and ASan/UBSan.
  # ---------------------------------------------------------------------
  gates:
    name: Gates (precondition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # gates.sh's own oracle wants BOTH compilers present (run.sh's gcc-vs-
      # clang differential is silently weaker with only one). gcc and go are
      # already on GitHub's ubuntu-latest image; clang is usually there too,
      # but install explicitly so the gate's coverage doesn't silently
      # degrade if the image ever changes.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Every gate. Locally (this repo's own worktree, Linux x86-64) this
      # took a few minutes end to end, dominated by the corpus run and the
      # ASan/UBSan pass; the timeout below is a generous multiple of that,
      # not a measured CI number -- CI runners vary, and this has not
      # actually run on one yet.
      - name: Run every gate
        timeout-minutes: 30
        run: ./gates.sh

  # ---------------------------------------------------------------------
  # Linux x86-64: compiler + every app. The only platform that fully
  # builds today -- see the macOS job for why it alone ships apps.
  # ---------------------------------------------------------------------
  build-linux-x86_64:
    name: Build — Linux x86-64
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Load language identity from config.sh
        run: |
          . ./config.sh
          echo "LANG_NAME=$LANG_NAME" >> "$GITHUB_ENV"
          echo "LANG_BIN=$LANG_BIN" >> "$GITHUB_ENV"
          echo "LANG_EXT=$LANG_EXT" >> "$GITHUB_ENV"

      - name: Build the compiler (release)
        run: |
          cargo build --release
          # build.sh and every apps/*/build.sh hardcode target/debug/$LANG_BIN
          # (none take a compiler-path override except build-gitui.sh's
          # LANGC= env var) -- so the release binary is placed there too,
          # rather than teaching every build script a new convention.
          mkdir -p target/debug
          cp "target/release/$LANG_BIN" "target/debug/$LANG_BIN"

      - name: Build every app
        run: |
          set -euo pipefail
          OUT="dist/${LANG_NAME}-linux-x86_64"
          mkdir -p "$OUT"
          cp "target/release/$LANG_BIN" "$OUT/$LANG_BIN"

          # apps/git -- the read-only CLI and the interactive client.
          # gitui.m31 pulls in apps/tui/ as well as apps/git/'s own files,
          # which this compiler cannot see from apps/git alone (imports
          # resolve against the entry file's own directory only) --
          # build-gitui.sh exists specifically to stage both into a temp
          # dir first. See apps/git/README.md and build-gitui.sh's header.
          ./build.sh apps/git/git.m31 -o "$OUT/ourgit"
          ./apps/git/build-gitui.sh -o "$OUT/ourgitui"

          # apps/markdown -- the one app with its own build.sh, which wants
          # OUT rather than -o.
          OUT="$OUT/markdown" bash apps/markdown/build.sh

          # apps/tui is a library (see apps/tui/README.md: "This library is
          # not part of the standard library"); demo.m31 and browse.m31 are
          # its only two standalone programs, so those are what ships.
          OUT="dist/${LANG_NAME}-linux-x86_64"
          ./build.sh apps/tui/demo.m31 -o "$OUT/tuidemo"
          ./build.sh apps/tui/browse.m31 -o "$OUT/tuibrowse"

          # apps/ssh is Phase 1 of the ssh work: SHA-256 and
          # ChaCha20-Poly1305 primitives only (docs/ssh-decision.md) -- there
          # is no client or server yet, so there is no "ssh app" binary to
          # ship. What exists and builds is the pair of self-check programs
          # that already run in apps/ssh/test.sh, named here for what they
          # are rather than implying a finished ssh client.
          ./build.sh apps/ssh/t_sha256.m31 -o "$OUT/ssh-sha256-selftest"
          ./build.sh apps/ssh/t_chacha20poly1305.m31 -o "$OUT/ssh-chacha20poly1305-selftest"

          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          ${LANG_NAME} — Linux x86-64 release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}

          $LANG_BIN                        the compiler (./$LANG_BIN --emit-c foo.$LANG_EXT -o foo.c)
          ourgit                       apps/git: read-only CLI (ourgit -log, -cat-file, ...)
          ourgitui                     apps/git: interactive client (run inside a repo)
          markdown                     apps/markdown: CommonMark subset to HTML
          tuidemo, tuibrowse           apps/tui: the library's two standalone example programs
          ssh-sha256-selftest          apps/ssh: SHA-256 self-check (Phase 1 crypto primitives only --
          ssh-chacha20poly1305-selftest  no ssh client/server exists yet, see docs/ssh-decision.md)
          EOF

      - name: Package
        run: |
          tar -C "dist/${LANG_NAME}-linux-x86_64" -czf "${LANG_NAME}-linux-x86_64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LANG_NAME }}-linux-x86_64
          path: ${{ env.LANG_NAME }}-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # macOS. Compiler only, for now -- read this before adding apps here.
  #
  # The compiler itself is pure Rust (Cargo.toml: zero dependencies, no
  # `unsafe`), so `cargo build --release` on a native macOS runner is a
  # plain cross-OS Rust build with nothing platform-specific to go wrong.
  #
  # The apps cannot be built on macOS AT ALL today, on EITHER architecture
  # -- this is a bigger gap than "arm64 needs a context-switch port", and
  # it is a research finding from reading this branch's own source and
  # docs, not a guess:
  #
  #   - build.sh and every apps/*/build.sh unconditionally compile and link
  #     runtime/reactor.c into every program (`spawn`/`Chan` always mean a
  #     green thread now -- see build.sh's own comment).
  #   - runtime/reactor.c unconditionally #includes <sys/epoll.h> and
  #     <sys/eventfd.h> with no #ifdef guard -- both Linux-only; they do
  #     not exist on macOS/BSD at all.
  #   - docs/concurrency-decision.md says this in so many words: "Every
  #     build line in the repository that links runtime/rt.c -- which is
  #     all of them -- now also links runtime/scheduler.c, runtime/
  #     reactor.c and runtime/ctx_switch_x86_64.s... The whole language is
  #     therefore x86-64 [and Linux] only until Phase 4's aarch64 context
  #     switch [and kqueue reactor] lands", and lists "kqueue (macOS/BSD)"
  #     under "Phase 4 -- portability", not yet done.
  #
  # So macOS x86-64 apps need the SAME Phase 4 kqueue reactor that macOS
  # arm64 apps need, on top of (for arm64 only) runtime/ctx_switch_aarch64.s.
  # Enabling apps here is therefore not a one-line change even once aarch64
  # lands -- it needs reactor.c to grow a kqueue backend first. Tracked by
  # leaving no apps step in this job at all, rather than a disabled one that
  # would look like it only needed uncommenting.
  # ---------------------------------------------------------------------
  build-macos:
    name: Build — macOS (${{ matrix.target_name }})
    needs: gates
    # TEMPORARILY DISABLED, whole job: GitHub Actions requires a matrix to
    # define at least one vector -- an `include:` with every entry commented
    # out is a schema-invalid matrix, not an empty-and-skipped one, and
    # fails the entire workflow at validation time before any job runs
    # (discovered the hard way: it showed up as an immediate, job-less
    # "failure" on every push, including ones that don't even touch a tag).
    # `if: false` is the actual way to disable a job while keeping the YAML
    # valid. Re-enable (flip this to `if: true` or delete the line, restore
    # the matrix below, add build-macos back to the release job's `needs:`)
    # once a second macOS remote is available -- do not leave it off
    # permanently, see the "last Intel image" note on the commented-out
    # macos-13 entry below.
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both entries TEMPORARILY DISABLED: GitHub's macos-13 (Intel)
          # pool has had so little available capacity that a run queues
          # indefinitely and the whole workflow never completes. Re-enable
          # macos-x86_64 once a second macOS remote is available (self-
          # hosted, or GitHub's queue easing) -- do not leave it off
          # permanently, see the "last Intel image" note below.
          # - target_name: macos-x86_64
          #   runner: macos-13 # last Intel GitHub-hosted macOS image

          # Apple Silicon. The *compiler* would build here today with zero
          # changes (pure Rust) -- this entry is kept disabled anyway so
          # that "macOS" in this workflow has one consistent meaning
          # (compiler-only, both architectures together) instead of arm64
          # quietly shipping before x86-64 apps do. To enable (once
          # macos-x86_64 above is also re-enabled):
          #   1. uncomment the two lines below
          #   2. runtime/ctx_switch_aarch64.s and a kqueue reactor backend
          #      both now exist (tonight's work) -- add an apps step here
          #      matching build-linux-x86_64's, using macos-14's native
          #      arm64 toolchain (no cross-compilation needed either way)
          # - target_name: macos-arm64
          #   runner: macos-14 # Apple Silicon GitHub-hosted image
          - target_name: placeholder
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Load language identity from config.sh
        run: |
          . ./config.sh
          echo "LANG_NAME=$LANG_NAME" >> "$GITHUB_ENV"
          echo "LANG_BIN=$LANG_BIN" >> "$GITHUB_ENV"

      - name: Build the compiler (release)
        run: cargo build --release

      - name: Package (compiler only -- see job comment above)
        run: |
          set -euo pipefail
          OUT="dist/${LANG_NAME}-${{ matrix.target_name }}"
          mkdir -p "$OUT"
          cp "target/release/$LANG_BIN" "$OUT/$LANG_BIN"
          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          ${LANG_NAME} — ${{ matrix.target_name }} release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}

          This archive contains the COMPILER ONLY ($LANG_BIN). The apps
          under apps/ are not built for macOS yet: every one of them links
          runtime/reactor.c, which unconditionally uses epoll/eventfd
          (Linux-only). A macOS (kqueue) reactor backend is Phase 4, not
          yet implemented -- see docs/concurrency-decision.md. Once it
          lands, this platform gets the same apps bundle Linux x86-64 does.
          EOF
          tar -C "dist/${LANG_NAME}-${{ matrix.target_name }}" -czf "${LANG_NAME}-${{ matrix.target_name }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LANG_NAME }}-${{ matrix.target_name }}
          path: ${{ env.LANG_NAME }}-${{ matrix.target_name }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Attach every platform's tarball to the GitHub Release for this tag.
  #
  # build-macos is NOT in `needs` right now: it's `if: false` (see its own
  # comment) while disabled, and a job's default `if: success()` treats a
  # skipped need as unmet, which would skip this job forever too. Add
  # build-macos back to `needs` in the same commit that re-enables it.
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    needs:
      - gates
      - build-linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
