name: Release

# Build release binaries for the compiler and every app under apps/, and
# attach them to the GitHub Release for a pushed version tag -- so they can
# be pulled by a direct URL (a release asset URL, stable per tag), not just
# built from source.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# gates.sh is a hard precondition: if it fails, nothing is built or
# published. A broken build must never produce a release.
#
# Verified by hand before this workflow was written (see the PR/commit this
# came in with for the session notes): `cargo build --release`,
# `./gates.sh`, and every `build.sh`/`build-*.sh` invocation below were run
# for real, on Linux x86-64, in a local worktree. What was NOT verified is
# this YAML actually executing on GitHub's runners -- that needs a real tag
# push. See the macOS notes below for the one thing that is a research
# finding rather than a guess.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release needs this to create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Precondition: every gate, on Linux. Nothing downstream runs if this
  # fails. This is the project's own ./gates.sh -- cargo build/test/clippy/
  # fmt, the "no dependencies"/"no unsafe" house rules, the runtime
  # separate-TU check, the full corpus (gcc vs clang, -O0 vs -O2, Go twins,
  # refcount invariant), the corpus again on raw syscalls, and ASan/UBSan.
  # ---------------------------------------------------------------------
  gates:
    name: Gates (precondition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # gates.sh's own oracle wants BOTH compilers present (run.sh's gcc-vs-
      # clang differential is silently weaker with only one). gcc and go are
      # already on GitHub's ubuntu-latest image; clang is usually there too,
      # but install explicitly so the gate's coverage doesn't silently
      # degrade if the image ever changes.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Every gate. "A few minutes" here was never actually measured -- a
      # real CI run of .github/workflows/ci.yml's identical step (commit
      # a8afd8c) hit a 30-minute timeout with "corpus (raw syscalls)" and
      # "sanitizers" never even starting. Locally (this repo's own
      # worktree, Linux x86-64) gates.sh takes 80-90 minutes end to end,
      # dominated by the corpus run (twice) and ASan/UBSan; 120 below is a
      # real margin above that, not another guess.
      - name: Run every gate
        timeout-minutes: 120
        run: ./gates.sh

  # ---------------------------------------------------------------------
  # Linux x86-64 and Linux aarch64: compiler + every app, identically --
  # see build-macos below for the one platform that still ships the
  # compiler only, and why.
  # ---------------------------------------------------------------------
  build-linux-x86_64:
    name: Build — Linux x86-64
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Load language identity from config.sh
        run: |
          . ./config.sh
          echo "LANG_NAME=$LANG_NAME" >> "$GITHUB_ENV"
          echo "LANG_BIN=$LANG_BIN" >> "$GITHUB_ENV"
          echo "LANG_EXT=$LANG_EXT" >> "$GITHUB_ENV"

      - name: Build the compiler (release)
        run: |
          cargo build --release
          # build.sh and every apps/*/build.sh hardcode target/debug/$LANG_BIN
          # (none take a compiler-path override except build-gitui.sh's
          # LANGC= env var) -- so the release binary is placed there too,
          # rather than teaching every build script a new convention.
          mkdir -p target/debug
          cp "target/release/$LANG_BIN" "target/debug/$LANG_BIN"

      - name: Build every app
        run: |
          set -euo pipefail
          OUT="dist/${LANG_NAME}-linux-x86_64"
          mkdir -p "$OUT"
          cp "target/release/$LANG_BIN" "$OUT/$LANG_BIN"

          # apps/git -- the read-only CLI and the interactive client.
          # gitui.m31 pulls in apps/tui/ as well as apps/git/'s own files,
          # which this compiler cannot see from apps/git alone (imports
          # resolve against the entry file's own directory only) --
          # build-gitui.sh exists specifically to stage both into a temp
          # dir first. See apps/git/README.md and build-gitui.sh's header.
          ./build.sh apps/git/git.m31 -o "$OUT/ourgit"
          ./apps/git/build-gitui.sh -o "$OUT/ourgitui"

          # apps/markdown -- the one app with its own build.sh, which wants
          # OUT rather than -o.
          OUT="$OUT/markdown" bash apps/markdown/build.sh

          # apps/tui is a library (see apps/tui/README.md: "This library is
          # not part of the standard library"); demo.m31 and browse.m31 are
          # its only two standalone programs, so those are what ships.
          OUT="dist/${LANG_NAME}-linux-x86_64"
          ./build.sh apps/tui/demo.m31 -o "$OUT/tuidemo"
          ./build.sh apps/tui/browse.m31 -o "$OUT/tuibrowse"

          # apps/ssh is Phase 1 of the ssh work: SHA-256 and
          # ChaCha20-Poly1305 primitives only (docs/ssh-decision.md) -- there
          # is no client or server yet, so there is no "ssh app" binary to
          # ship. What exists and builds is the pair of self-check programs
          # that already run in apps/ssh/test.sh, named here for what they
          # are rather than implying a finished ssh client.
          ./build.sh apps/ssh/t_sha256.m31 -o "$OUT/ssh-sha256-selftest"
          ./build.sh apps/ssh/t_chacha20poly1305.m31 -o "$OUT/ssh-chacha20poly1305-selftest"

          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          ${LANG_NAME} — Linux x86-64 release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}

          $LANG_BIN                        the compiler (./$LANG_BIN --emit-c foo.$LANG_EXT -o foo.c)
          ourgit                       apps/git: read-only CLI (ourgit -log, -cat-file, ...)
          ourgitui                     apps/git: interactive client (run inside a repo)
          markdown                     apps/markdown: CommonMark subset to HTML
          tuidemo, tuibrowse           apps/tui: the library's two standalone example programs
          ssh-sha256-selftest          apps/ssh: SHA-256 self-check (Phase 1 crypto primitives only --
          ssh-chacha20poly1305-selftest  no ssh client/server exists yet, see docs/ssh-decision.md)
          EOF

      - name: Package
        run: |
          tar -C "dist/${LANG_NAME}-linux-x86_64" -czf "${LANG_NAME}-linux-x86_64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LANG_NAME }}-linux-x86_64
          path: ${{ env.LANG_NAME }}-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Linux aarch64: the identical build-linux-x86_64 job, on GitHub's native
  # (not emulated) ARM64 Linux runner -- `.github/workflows/aarch64.yml`
  # already confirms the full gate suite, including every runtime phase
  # test, passes natively here. This is the first time any app under
  # apps/ has been built on this architecture specifically (gates.sh
  # itself never touches apps/), so a failure here is new information,
  # not a regression of something previously proven -- it is caught by
  # this job alone, not by the `gates` precondition above.
  # ---------------------------------------------------------------------
  build-linux-aarch64:
    name: Build — Linux aarch64
    needs: gates
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Load language identity from config.sh
        run: |
          . ./config.sh
          echo "LANG_NAME=$LANG_NAME" >> "$GITHUB_ENV"
          echo "LANG_BIN=$LANG_BIN" >> "$GITHUB_ENV"
          echo "LANG_EXT=$LANG_EXT" >> "$GITHUB_ENV"

      - name: Build the compiler (release)
        run: |
          cargo build --release
          mkdir -p target/debug
          cp "target/release/$LANG_BIN" "target/debug/$LANG_BIN"

      - name: Build every app
        run: |
          set -euo pipefail
          OUT="dist/${LANG_NAME}-linux-aarch64"
          mkdir -p "$OUT"
          cp "target/release/$LANG_BIN" "$OUT/$LANG_BIN"

          ./build.sh apps/git/git.m31 -o "$OUT/ourgit"
          ./apps/git/build-gitui.sh -o "$OUT/ourgitui"

          OUT="$OUT/markdown" bash apps/markdown/build.sh

          OUT="dist/${LANG_NAME}-linux-aarch64"
          ./build.sh apps/tui/demo.m31 -o "$OUT/tuidemo"
          ./build.sh apps/tui/browse.m31 -o "$OUT/tuibrowse"

          ./build.sh apps/ssh/t_sha256.m31 -o "$OUT/ssh-sha256-selftest"
          ./build.sh apps/ssh/t_chacha20poly1305.m31 -o "$OUT/ssh-chacha20poly1305-selftest"

          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          ${LANG_NAME} — Linux aarch64 release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}

          $LANG_BIN                        the compiler (./$LANG_BIN --emit-c foo.$LANG_EXT -o foo.c)
          ourgit                       apps/git: read-only CLI (ourgit -log, -cat-file, ...)
          ourgitui                     apps/git: interactive client (run inside a repo)
          markdown                     apps/markdown: CommonMark subset to HTML
          tuidemo, tuibrowse           apps/tui: the library's two standalone example programs
          ssh-sha256-selftest          apps/ssh: SHA-256 self-check (Phase 1 crypto primitives only --
          ssh-chacha20poly1305-selftest  no ssh client/server exists yet, see docs/ssh-decision.md)
          EOF

      - name: Package
        run: |
          tar -C "dist/${LANG_NAME}-linux-aarch64" -czf "${LANG_NAME}-linux-aarch64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LANG_NAME }}-linux-aarch64
          path: ${{ env.LANG_NAME }}-linux-aarch64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # macOS, Apple Silicon only: compiler + every app, same shape as the two
  # Linux jobs above.
  #
  # Re-enabled from a long-disabled, compiler-only placeholder: the two
  # things that job's own comment named as blockers --
  # runtime/ctx_switch_aarch64.S and a kqueue reactor backend
  # (runtime/reactor_kqueue.c) -- both exist now, and
  # `.github/workflows/macos.yml` already confirms the full gate suite
  # passes natively on `macos-14` (Apple Silicon). This is still the
  # FIRST time any app under apps/ has been built on macOS at all (gates.sh
  # itself never touches apps/), so a failure here is new information, not
  # a regression of something previously proven.
  #
  # `macos-13` (Intel) stays out on purpose, not an oversight: GitHub's
  # macos-13 pool has had so little available capacity that a run queues
  # indefinitely (the same reason `.github/workflows/macos.yml` dropped it
  # from its own matrix) -- re-add it once a second macOS remote is
  # available, matching that file's own note.
  # ---------------------------------------------------------------------
  build-macos:
    name: Build — macOS (arm64)
    needs: gates
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Load language identity from config.sh
        run: |
          . ./config.sh
          echo "LANG_NAME=$LANG_NAME" >> "$GITHUB_ENV"
          echo "LANG_BIN=$LANG_BIN" >> "$GITHUB_ENV"
          echo "LANG_EXT=$LANG_EXT" >> "$GITHUB_ENV"

      - name: Build the compiler (release)
        run: |
          cargo build --release
          mkdir -p target/debug
          cp "target/release/$LANG_BIN" "target/debug/$LANG_BIN"

      - name: Build every app
        run: |
          set -euo pipefail
          OUT="dist/${LANG_NAME}-macos-arm64"
          mkdir -p "$OUT"
          cp "target/release/$LANG_BIN" "$OUT/$LANG_BIN"

          ./build.sh apps/git/git.m31 -o "$OUT/ourgit"
          ./apps/git/build-gitui.sh -o "$OUT/ourgitui"

          OUT="$OUT/markdown" bash apps/markdown/build.sh

          OUT="dist/${LANG_NAME}-macos-arm64"
          ./build.sh apps/tui/demo.m31 -o "$OUT/tuidemo"
          ./build.sh apps/tui/browse.m31 -o "$OUT/tuibrowse"

          ./build.sh apps/ssh/t_sha256.m31 -o "$OUT/ssh-sha256-selftest"
          ./build.sh apps/ssh/t_chacha20poly1305.m31 -o "$OUT/ssh-chacha20poly1305-selftest"

          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          ${LANG_NAME} — macOS arm64 (Apple Silicon) release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}

          $LANG_BIN                        the compiler (./$LANG_BIN --emit-c foo.$LANG_EXT -o foo.c)
          ourgit                       apps/git: read-only CLI (ourgit -log, -cat-file, ...)
          ourgitui                     apps/git: interactive client (run inside a repo)
          markdown                     apps/markdown: CommonMark subset to HTML
          tuidemo, tuibrowse           apps/tui: the library's two standalone example programs
          ssh-sha256-selftest          apps/ssh: SHA-256 self-check (Phase 1 crypto primitives only --
          ssh-chacha20poly1305-selftest  no ssh client/server exists yet, see docs/ssh-decision.md)
          EOF

      - name: Package
        run: |
          tar -C "dist/${LANG_NAME}-macos-arm64" -czf "${LANG_NAME}-macos-arm64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LANG_NAME }}-macos-arm64
          path: ${{ env.LANG_NAME }}-macos-arm64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Attach every platform's tarball to the GitHub Release for this tag.
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    needs:
      - gates
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
