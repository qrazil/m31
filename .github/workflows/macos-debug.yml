name: macos-debug
on:
  push:
    branches: [ "ci-debug/**" ]
jobs:
  stress:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: bash ci_debug.sh
        timeout-minutes: 20
