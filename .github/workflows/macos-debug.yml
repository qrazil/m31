name: macos-debug
on:
  push:
    branches: [ "ci-debug/**" ]
jobs:
  stage:
    strategy:
      fail-fast: false
      matrix:
        stage: [ dbg ]
    runs-on: macos-14
    timeout-minutes: 30
    name: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cargo build
      - run: bash ci_debug.sh ${{ matrix.stage }}
        timeout-minutes: 20
