name: Release

# A library ships as source: consumers pin a commit or tag in their `deps`.
# This publishes a GitHub Release for a pushed version tag, after test.yml
# passes on every platform.
#
#   git tag v@@VERSION@@ && git push origin v@@VERSION@@
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release creates the release

jobs:
  test:
    name: Test (precondition)
    uses: ./.github/workflows/test.yml

  release:
    name: Publish release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
