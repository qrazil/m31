[package]
name = "m31c"
version = "0.4.0"
edition = "2021"

# No dependencies. Not "few" -- none. The whole compiler is std Rust, and the
# backend emits C text, so there is nothing to pull in. See docs/ir-v0.md.
[dependencies]

[[bin]]
name = "m31c"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
